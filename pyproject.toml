[project]
name = "weatherflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dbt-postgres>=1.11.0",
    "httpx2>=2.13.1",
    "polars>=1.44.2",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.3.6",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.54",
]

[project.scripts]
weatherflow = "weatherflow:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv.workspace]
members = [
    "backend",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
