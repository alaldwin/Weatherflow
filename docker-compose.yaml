# Weatherflow pipeline.
 
services:

  app:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    image: weatherflow:local

    env_file:
      - .env

    environment: 
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-weatherflow}
      POSTGRES_USER: ${POSTGRES_USER:-weatherflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weatherflow}

    depends_on:
      db:
        condition: service_healthy

    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

    networks:
      - weatherflow_net

    command: ["python", "-m", "pipeline.main"]



  db:

    image: postgres:15

    container_name: wf-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-weatherflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weatherflow}
      POSTGRES_DB: ${POSTGRES_DB:-weatherflow}

    ports:
      - "5433:5432"

    volumes:
      - db-data:/var/lib/postgresql/data

    networks:
      - weatherflow_net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s



  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile

    container_name: wf-airflow
    
    restart: unless-stopped

    env_file:
      - .env

    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__DAGS_FOLDER: /opt/weatherflow/airflow/dags
      AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: "180"
      PYTHONPATH: /opt/weatherflow
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-weatherflow}
      POSTGRES_USER: ${POSTGRES_USER:-weatherflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weatherflow}

    command: standalone

    ports:
      - "8080:8080"

    volumes:
      - ./:/opt/weatherflow
      - airflow-data:/opt/airflow

    networks:
      - weatherflow_net

    depends_on:
      db:
        condition: service_healthy


  dbt:
    image: dbt:local

    build:
      context: .
      dockerfile: dbt_weatherflow/Dockerfile.dbt

    working_dir: /usr/app/dbt

    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-weatherflow}
      POSTGRES_USER: ${POSTGRES_USER:-weatherflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    networks:
      - weatherflow_net

    profiles:
      - tools



  backend:
    build:
      context: . 
      dockerfile: backend/Dockerfile

    image: weatherflow-backend:local

    container_name: wf-backend

    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-weatherflow}
      POSTGRES_USER: ${POSTGRES_USER:-weatherflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weatherflow}

    ports:
      - "8000:8000"

    volumes:
      - ./data/forecast_cache:/app/data/forecast_cache

    networks:
      - weatherflow_net

    depends_on:
      db:
        condition: service_healthy



networks:
  weatherflow_net:
    name: weatherflow_net
    driver: bridge


volumes:
  db-data:
  airflow-data:
